<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battleship Arena</title>
    <meta name="description" content="Play Battleship against Python bots that run in your browser." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&family=Pirata+One&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="image" href="img/hat.webp" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1><span class="logo-text">Battleship Arena</span></h1>
      <nav>
        <button id="nav-play">Play</button>
        <button id="nav-tournament">Tournament</button>
        <button id="nav-ranking">Ranking</button>
        <button id="nav-about">About</button>
        <button id="sound" aria-pressed="false"></button>
        <button id="levels" aria-expanded="false" aria-controls="levels-panel">
          <svg class="levels-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4v16M12 4v16M19 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55" />
            <rect x="2.5" y="12" width="5" height="3.4" rx="1.2" fill="currentColor" />
            <rect x="9.5" y="6" width="5" height="3.4" rx="1.2" fill="currentColor" />
            <rect x="16.5" y="14.5" width="5" height="3.4" rx="1.2" fill="currentColor" />
          </svg>
        </button>
        <button id="lang" title="English / Español">ES</button>
      </nav>
      <div id="levels-panel" class="levels-panel" hidden>
        <label><span id="level-music-label">Music</span><input id="level-music" type="range" min="0" max="100" step="5" /></label>
        <label><span id="level-voice-label">Parrot's voice</span><input id="level-voice" type="range" min="0" max="100" step="5" /></label>
        <p id="levels-hint" class="levels-hint"></p>
      </div>
    </header>
    <main id="app"></main>
    <noscript>This page needs JavaScript (it runs Python in your browser with Pyodide).</noscript>
  </body>
</html>
