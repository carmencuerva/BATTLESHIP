<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battleship Arena</title>
    <meta name="description" content="Play Battleship against Python bots that run in your browser." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&family=Pirata+One&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="image" href="img/hat.webp" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>☠️ Battleship Arena</h1>
      <nav>
        <button id="nav-play">Play</button>
        <button id="nav-tournament">Tournament</button>
        <button id="nav-ranking">Ranking</button>
        <button id="nav-about">About</button>
        <button id="sound" aria-pressed="true">🔊</button>
        <button id="lang" title="English / Español">ES</button>
      </nav>
    </header>
    <main id="app"></main>
    <noscript>This page needs JavaScript (it runs Python in your browser with Pyodide).</noscript>
  </body>
</html>
