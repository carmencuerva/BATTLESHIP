name: tournament

# Replays the official tournament whenever the engine or the players change on main.
# main is protected (every change goes through a pull request), so this workflow does not
# push: it shows the standings in the run summary and keeps the JSON as a downloadable
# artifact. The page publishes its own freshly played standings (see pages.yml).

on:
  push:
    branches: [main]
    paths: ["src/**", "players/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Play the tournament
        run: battleship-tournament | tee standings.txt
      - name: Show the standings in the run summary
        run: |
          {
            echo "## Standings"
            echo
            echo '```'
            cat standings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard
          path: results/leaderboard.json
