[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battleship-arena"
version = "0.1.0"
description = "Battleship engine, bot API and automatic tournament; the same Python runs in CI and in the browser (Pyodide)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Lucía Argüello" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
docs = ["mkdocs-material>=9", "mkdocs-static-i18n>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/battleship"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
